{% set name = "mesas" %}
{% set version = "2.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fb2cc7054f211348f65304e09eb83f76e2d25e6de1c0b29d3c0e7a208ee2f9dc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling >=1.21
    - pip
  run:
    - python >={{ python_min }}
    - pandas
    - numpy >1.22
    - numba
    - scipy
    - matplotlib-base

test:
  requires:
    - python {{ python_min }}.*
    - pip
  imports:
    - mesas
    - mesas.sas.model
    - mesas.sas._solve_numba
  commands:
    - pip check

about:
  home: https://github.com/JH-LandHydroLab/mesas
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: multiresolution estimation of storage selection

  description: |
    mesas is a suite of tools for analyzing tracer data and modeling solute
    transport in time-variable input-output flow systems using StorAge
    Selection (SAS) functions. As of v2 it is written in pure Python; the
    numerical solver is JIT-compiled with Numba (no Fortran compiler
    required).
  doc_url: https://mesas.readthedocs.io/
  dev_url: https://github.com/JH-LandHydroLab/mesas

extra:
  recipe-maintainers:
    - charman2
